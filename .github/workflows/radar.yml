# Radar CH — converts the newest MeteoSwiss precipitation radar picture every ten minutes and publishes it on GitHub Pages;
# the national radars with a keyless WMS (DWD, FMI) are fetched beside it (wms.py) and listed in sources.json.
# Pages: Settings → Pages → Source "GitHub Actions" (once). The site then stands at https://<owner>.github.io/<repo>/
name: radar
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # the last frames travel from run to run through the cache (a rolling key; the newest matching cache is restored)
      - uses: actions/cache/restore@v4
        id: frames
        with:
          path: site
          key: radar-site-${{ github.run_id }}
          restore-keys: |
            radar-site-
      - run: python3 convert.py --out site --frames 12
      # the other national radars (keyless WMS: DWD, FMI) through the same site; a failing service never stops the Swiss picture
      - run: python3 wms.py --out site --frames 12
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: site
          key: radar-site-${{ github.run_id }}
      - uses: actions/configure-pages@v5          # until Pages is switched on (Settings → Pages → Source: GitHub Actions) this step is skipped over, the run stays green
        id: pages
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: convert
    if: needs.convert.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
