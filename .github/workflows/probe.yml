# A look at the WMS services' capabilities (by hand only): which layers exist, which carry a time dimension.
name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 wms.py --probe
      - run: python3 grids.py --probe
        continue-on-error: true
      - run: python3 grids.py --probe --only at
        continue-on-error: true
