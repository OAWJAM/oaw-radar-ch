# A look at the WMS services' capabilities (by hand only): which layers exist, which carry a time dimension.
name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 wms.py --probe
      - run: python3 grids.py --probe
        continue-on-error: true
      - run: python3 grids.py --probe --only at
        continue-on-error: true
      - run: python3 grids.py --probe --only thredds
        continue-on-error: true
      - run: python3 grids.py --probe --only dmi
        continue-on-error: true
      # ČHMÚ (7 Nov, the owner: «CZ ja»): the portal's licence lines, the newest MAX_Z files, one file's HDF5 layout
      - run: python3 grids.py --probe --only cz
        continue-on-error: true
      # Italy (7 Nov, the owner: «Italien go»): the Protezione Civile platform — the licence lines, the newest products, the download with and without the Origin header, the GeoTIFF's frame
      - run: python3 grids.py --probe --only it
        continue-on-error: true
      # the two chart sources the boards read (7 Nov): ECMWF Open Charts' answers (run, areas, levels), MET Norway's sigcharts list shape
      - run: python3 probe_charts.py
        continue-on-error: true
      # Rainbow.ai (7 Nov): with the secret, what each layer answers (snapshot, a tile's size and mode, the dbz_u8 palette); without it, «no key — skipped»
      - run: python3 rainbow.py --probe
        continue-on-error: true
        env:
          RAINBOW_API_KEY: ${{ secrets.RAINBOW_API_KEY }}
